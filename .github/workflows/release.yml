name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      # The release build cross-compiles the Go tool into the platform
      # packages before changesets publishes them.
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/mr-hulla-go/go.mod
      - run: pnpm run build
      # Node 22 ships npm 10; OIDC trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - name: Version or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          github-token: ${{ secrets.CHANGES_PAT }}
